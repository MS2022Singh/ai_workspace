<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Control Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h3 { margin-top: 0; color: #f472b6; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        .timestamp { font-size: 11px; color: #94a3b8; }
        .status-badge { background: #065f46; color: #34d399; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Workspace Control Dashboard</h1>
            <div><span class="status-badge" id="status-text">SYSTEM ONLINE</span></div>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Project Metadata</h3>
                <p><strong>Project Name:</strong> <span id="proj-name">Loading...</span></p>
                <p><strong>Last Updated:</strong> <span id="proj-time">Loading...</span></p>
            </div>
            <div class="card">
                <h3>Decisions Log</h3>
                <ul id="decisions-list"></ul>
            </div>
            <div class="card">
                <h3>Completed Work</h3>
                <ul id="completed-list"></ul>
            </div>
            <div class="card">
                <h3>Pending Work & Issues</h3>
                <ul id="issues-list"></ul>
            </div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('proj-name').innerText = data.project_name;
                document.getElementById('proj-time').innerText = data.last_updated;

                const fillList = (elementId, items, formatter) => {
                    const ul = document.getElementById(elementId);
                    ul.innerHTML = '';
                    if (!items || items.length === 0) {
                        ul.innerHTML = '<li>No records found.</li>';
                        return;
                    }
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = formatter(item);
                        ul.appendChild(li);
                    });
                };

                fillList('decisions-list', data.decisions, i => `${i.decision} <br><span class="timestamp">${i.timestamp}</span>`);
                fillList('completed-list', data.completed_work, i => `${i.item} <br><span class="timestamp">${i.timestamp}</span>`);
                
                const pendingAndIssues = [...(data.pending_work || []), ...(data.issues || [])];
                fillList('issues-list', pendingAndIssues, i => `${i.item || i.issue} <br><span class="timestamp">${i.timestamp}</span>`);
            } catch (err) {
                console.error("Failed to fetch dashboard state:", err);
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
