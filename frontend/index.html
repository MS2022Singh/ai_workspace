<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">
    <!-- Top Navigation Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="font-bold text-lg tracking-wide text-white">AI WORKSPACE OS</h1>
        </div>
        <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
            Active Agents: <span class="text-emerald-400 font-semibold">Software Architect, UI Designer, Reality Checker</span>
        </div>
    </header>

    <!-- Main Chat & Stream Workspace -->
    <main class="flex-1 flex flex-col max-w-5xl w-full mx-auto p-4 overflow-hidden">
        <div id="chat-stream-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-900/50 rounded-xl border border-slate-800 shadow-inner">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow">
                <h3 class="font-bold text-blue-400 text-sm mb-1">SYSTEM INITIALIZED</h3>
                <p class="text-sm text-slate-300">Multi-expert AI team active. Enter your command or task below to execute across worker pipelines.</p>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="mt-4 flex gap-3 bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-lg">
            <input id="user-input" type="text" placeholder="Enter task (e.g., 'Build a responsive dashboard panel')..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
            <button id="execute-btn" type="button" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg text-sm font-semibold shadow transition flex items-center gap-2 cursor-pointer">
                <span>Execute</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>
    </main>

    <!-- Cache-busting parameter to force fresh JS load -->
    <script src="app.js?v=3"></script>
</body>
</html>
