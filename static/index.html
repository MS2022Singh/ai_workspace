<!DOCTYPE html>
<html lang=""en"">
<head>
    <meta charset=""UTF-8"">
    <meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
    <title>AI Workspace OS - Command Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .status-badge { background: #1e4620; color: #4caf50; padding: 5px 12px; border-radius: 4px; font-weight: bold; font-size: 0.9em; letter-spacing: 1px; }
        .panel { background-color: #1e1e1e; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; font-size: 0.9em;}
        select, input { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        select:focus, input:focus { outline: none; border-color: #0d47a1; }
        button { background-color: #0d47a1; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s; width: 100%;}
        button:hover { background-color: #1565c0; }
        .terminal { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 4px; height: 250px; overflow-y: auto; white-space: pre-wrap; font-size: 0.9em; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);}
        .module-item { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 10px 15px; border-radius: 4px; margin-bottom: 8px; border-left: 4px solid #4caf50; }
        .module-item.disabled { border-left-color: #f44336; opacity: 0.6; }
        .toggle-btn { background: #333; border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; width: auto; font-size: 0.8em; }
        .toggle-btn.active { background: #1b5e20; border-color: #4caf50; }
    </style>
</head>
<body>
    <div class=""container"">
        <div class=""header"">
            <h1>AI Workspace OS</h1>
            <div id=""status"" class=""status-badge"">Connecting...</div>
        </div>

        <div class=""panel"">
            <h3 style=""margin-top: 0;"">Settings: Active UI Repositories</h3>
            <p style=""font-size: 0.85em; color: #aaa; margin-top: -5px;"">UI design repos are active by default on boot and can be toggled via user settings below.</p>
            <div id=""modulesList"">Loading modules...</div>
        </div>

        <div class=""panel"">
            <h3 style=""margin-top: 0;"">Command Input</h3>
            <div class=""form-group"">
                <label for=""taskType"">Select OS Operation</label>
                <select id=""taskType"">
                    <option value=""inspect_system"">Inspect System Health (Level 1)</option>
                    <option value=""learn_skill"">Learn Cognitive Skill</option>
                    <option value=""eliminate_block"">Eliminate Mental Block</option>
                </select>
            </div>
            <div class=""form-group"" id=""payloadGroup"" style=""display:none;"">
                <label for=""payloadData"">Payload Parameter (Skill Name / Block Description)</label>
                <input type=""text"" id=""payloadData"" placeholder=""Enter parameters here..."">
            </div>
            <button onclick=""executeTask()"">Execute Command</button>
        </div>

        <div class=""panel"">
            <h3 style=""margin-top: 0; margin-bottom: 10px;"">System Terminal</h3>
            <div id=""terminal"" class=""terminal"">Initializing Workspace OS Command Center...</div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const taskTypeSelect = document.getElementById('taskType');
        const payloadGroup = document.getElementById('payloadGroup');
        const payloadData = document.getElementById('payloadData');
        const statusBadge = document.getElementById('status');
        const modulesList = document.getElementById('modulesList');

        function logToTerminal(message) {
            const timestamp = new Date().toLocaleTimeString();
            terminal.innerHTML += \n[] ;
            terminal.scrollTop = terminal.scrollHeight;
        }

        taskTypeSelect.addEventListener('change', (e) => {
            if (e.target.value !== 'inspect_system') {
                payloadGroup.style.display = 'block';
            } else {
                payloadGroup.style.display = 'none';
            }
        });

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                statusBadge.innerText = OS STATE: ;
                
                // Render modules list
                let html = '';
                for (const [name, info] of Object.entries(data.active_modules)) {
                    const isActive = info.status === 'active';
                    html += 
                        <div class=""module-item "">
                            <div>
                                <strong></strong> <span style=""font-size: 0.8em; color: #888;"">()</span><br>
                                <small style=""color: #aaa;"">Capabilities: </small>
                            </div>
                            <button class=""toggle-btn "" onclick=""toggleModule('', )"">
                                
                            </button>
                        </div>
                    ;
                }
                modulesList.innerHTML = html || '<p>No modules loaded.</p>';
            } catch (err) {
                statusBadge.innerText = 'OFFLINE';
                statusBadge.style.background = '#4a1414';
                statusBadge.style.color = '#ff5252';
                logToTerminal(> CRITICAL ERROR: Unable to reach OS Core. );
            }
        }

        async function toggleModule(toolName, newState) {
            try {
                const response = await fetch('/api/modules/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tool_name: toolName, active: newState })
                });
                const data = await response.json();
                logToTerminal(> MODULE SETTING UPDATED:  is now );
                checkStatus();
            } catch (err) {
                logToTerminal(> TOGGLE FAILED: );
            }
        }

        async function executeTask() {
            const taskType = taskTypeSelect.value;
            let payload = {};
            if (taskType === 'learn_skill') {
                payload = { skill: payloadData.value || 'General Architecture' };
            } else if (taskType === 'eliminate_block') {
                payload = { block: payloadData.value || 'Unknown Block' };
            }

            logToTerminal(\n> EXECUTING: ...);
            try {
                const response = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_type: taskType, payload: payload, user_level: 1 })
                });
                const data = await response.json();
                logToTerminal(> RESPONSE RECEIVED:\n);
                checkStatus(); 
            } catch (err) {
                logToTerminal(> EXECUTION FAILED: );
            }
        }

        setTimeout(checkStatus, 500);
    </script>
</body>
</html>
