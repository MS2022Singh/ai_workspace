<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Command Center</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: var(--accent-blue); display: flex; align-items: center; justify-content: space-between; }
        .refresh-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
        .refresh-btn:hover { color: var(--text-main); }

        .tool-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .tool-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }
        .tool-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .tool-name { font-weight: 600; font-size: 0.9rem; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .tool-meta { font-size: 0.8rem; color: var(--text-muted); }

        #main-content { flex: 1; display: flex; flex-direction: column; }

        #top-bar {
            height: 55px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .system-status { display: flex; align-items: center; gap: 15px; font-size: 0.85rem; }
        .status-pill { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); color: var(--accent-green); padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .status-dot { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; display: inline-block; }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-box {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .msg-system { background-color: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-start; }
        .msg-user { background-color: var(--accent-blue); color: white; align-self: flex-end; }
        .msg-logs { font-family: 'Courier New', Courier, monospace; font-size: 0.8rem; background: #090d16; color: #38bdf8; padding: 10px; border-radius: 6px; margin-top: 10px; }

        #input-panel {
            padding: 15px 20px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .agent-select {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .command-input {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .send-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .send-btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-title">
            <span>Tool Registry Hub</span>
            <button class="refresh-btn" onclick="loadTools()" title="Refresh Registry">?</button>
        </div>
        <div class="tool-list" id="tool-list-container">
            <div class="tool-meta">Loading registered tools...</div>
        </div>
    </div>

    <div id="main-content">
        <div id="top-bar">
            <div class="system-status">
                <div class="status-pill"><span class="status-dot"></span> System Clean</div>
                <div id="device-info" class="tool-meta">Device: Loading...</div>
            </div>
            <div class="tool-meta" id="version-tag">Version: v0.8.2</div>
        </div>

        <div id="chat-window">
            <div class="message-box msg-system">
                <strong>Command Center Ready</strong><br>
                AI Workspace active with full Agent & Tool Integration. Type a prompt or trigger an action below.
            </div>
        </div>

        <div id="input-panel">
            <select class="agent-select" id="agent-selector">
                <option value="Auto-Orchestrator">Auto-Orchestrator</option>
                <option value="PhD Research Agent">PhD Research Agent</option>
                <option value="Full-Stack Engineer">Full-Stack Engineer</option>
                <option value="Voice Assistant">Voice Assistant</option>
            </select>
            <input type="text" class="command-input" id="prompt-input" placeholder="Enter task or tool payload command..." onkeydown="if(event.key==='Enter') executeCommand()">
            <button class="send-btn" onclick="executeCommand()">Execute</button>
        </div>
    </div>

    <script>
        async function loadTools() {
            try {
                const res = await fetch('/api/tools');
                const tools = await res.json();
                const container = document.getElementById('tool-list-container');
                container.innerHTML = '';

                Object.keys(tools).forEach(id => {
                    const tool = tools[id];
                    const card = document.createElement('div');
                    card.className = 'tool-card';
                    card.innerHTML = '<div class="tool-header">' +
                        '<span class="tool-name">' + (tool.name || id) + '</span>' +
                        '<span class="badge">' + (tool.perm || 'ACTIVE') + '</span>' +
                        '</div>' +
                        '<div class="tool-meta">Category: ' + (tool.category || 'General') + '</div>';
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Failed to load tools:", err);
            }
        }

        async function loadSystemStatus() {
            try {
                const res = await fetch('/api/system');
                const sys = await res.json();
                document.getElementById('device-info').innerText = 'Device: ' + sys.device.device_id + ' (' + sys.device.os + ')';
                document.getElementById('version-tag').innerText = 'Version: ' + sys.version;
            } catch (err) {
                console.error("Failed to load system status:", err);
            }
        }

        async function executeCommand() {
            const input = document.getElementById('prompt-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            const agent = document.getElementById('agent-selector').value;
            const chatWindow = document.getElementById('chat-window');

            const userMsg = document.createElement('div');
            userMsg.className = 'message-box msg-user';
            userMsg.innerText = prompt;
            chatWindow.appendChild(userMsg);

            input.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const res = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, agent: agent })
                });
                const data = await res.json();

                const sysMsg = document.createElement('div');
                sysMsg.className = 'message-box msg-system';
                
                let logHtml = data.execution_logs.map(log => '• ' + log).join('<br>');
                sysMsg.innerHTML = '<strong>' + data.agent + '</strong><br>' +
                    data.response +
                    '<div class="msg-logs">' + logHtml + '</div>';
                chatWindow.appendChild(sysMsg);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            } catch (err) {
                console.error("Execution failed:", err);
            }
        }

        loadTools();
        loadSystemStatus();
    </script>
</body>
</html>
